version: "3.8"

services:
  pgmoposita:
    image: pgpam:1.0.1
    build: .
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pgmoposita.entrypoints=http"
        - "traefik.http.routers.pgmoposita.rule=Host(pgmoposita.byronrm.com)"
        - "traefik.http.middlewares.pgmoposita-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.pgmoposita.middlewares=pgmoposita-https-redirect"
        - "traefik.http.routers.pgmoposita-secure.entrypoints=https"
        - "traefik.http.routers.pgmoposita-secure.rule=Host(pgmoreno.byronrm.com)"
        - "traefik.http.routers.pgmoposita-secure.tls=true"
        - "traefik.http.routers.pgmoposita-secure.tls.certresolver=http"
        - "traefik.http.routers.pgmoposita-secure.service=pgmoposita"
        - "traefik.http.services.pgmoposita.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true